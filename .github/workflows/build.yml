name: build

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.19.0

      - name: Get npm cache directory
        id: npm-cache
        run: |
          echo "::set-output name=dir::$(npm config get cache)"
      - name: Setup npm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci || npm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Build source
        run: npm run build

      - name: Verify CommonJS entry point
        run: |
          node - <<'NODE'
          require('./dist/index.js');
          let requested = '';
          global.fetch = async (url) => {
            requested = String(url);
            return {
              ok: true,
              status: 200,
              json: async () => ({ version: require('./package.json').version }),
            };
          };
          const { checkUpdates } = require('./dist/controllers/welcome.js');
          (async () => {
            await checkUpdates();
            if (!requested.includes('%40wppconnect-team%2Fwppconnect/latest')) {
              throw new Error(`Unexpected registry URL: ${requested}`);
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
